# generation/scene/textures.lock — 씬 텍스처 정본. 파일마다 출처 URL · 라이선스 · SHA256 한 줄.
# fetch_textures.py 가 이대로 내려받아 해시를 검증하고, 맞지 않는 파일은 쓰지 않고 지운다.
#
# 열: name role map license source url sha256
#   role    layout.py 의 materials.<name>.texture 가 가리키는 텍스처 세트
#   map     diffuse | normal_gl | roughness | archive (zip 으로 배포되는 세트의 zip 자체)
#   url     https 주소, 또는 zip 안의 파일이면 "zip:<멤버 이름>" (같은 role 의 archive 줄에서 꺼낸다)
#
# 라이선스 표기는 각 자산 페이지에서 확인했다 (2026-09-22): Poly Haven "CC0 License",
# ambientCG "released under the Creative Commons CC0 license". 골판지는 Poly Haven 에 없어
# ambientCG 에서 가져왔고, ambientCG 는 zip 으로만 배포하므로 zip 과 낱장을 모두 적는다.
# 채널 수는 파일마다 다르다 (roughness 가 RGB 인 것도 L 인 것도 있다) — 읽는 쪽이 가정하지 말 것.
