# 관절 인형(v2)의 피부를 부위 몸마다 갈라 붙일 때 정하는 두 가지 — 엉뚱한 몸에 든 조각의 정리와 관절 이음새 섞기.
#
# 입힌 인형은 피부 내보내기(keti_skin.obj) 한 장을 부위 몸마다 갈라 각 몸의 자식으로 붙인다(면은 세 정점이 가장 가까운
# 부위 프리미티브의 다수결로). 관절이 굽으면 갈린 가장자리가 서로 떨어져, 틈으로 비어 있는 옷 안이 보인다. 그래서
# build_dummy.py --seams 가 이음새 근처의 피부 정점마다 이웃 몸과 섞는 비율을 그 피부 메시에 싣고, 실행이 렌더할 때마다
# 그 정점을 두 몸의 지금 자세 사이로 옮긴다(generation/envs/s1d/skin_blend.py). 피부에는 물리 속성이 없어 물리는 그대로다.
#
# 피부 내보내기와 텍스처 lock 은 v1 입힌 인형도 함께 쓰므로 거기를 고치면 v1 의 고정 해시가 깨진다. 그래서 이 명세는
# 관절 인형을 지을 때만 읽고, 그 해시가 인형 USD 안에 실린다. 모든 값은 과제가 정한 값이다(자체 설정). 표준에서 온 값은 없다.

seams_version: "1"
determined_by: project

# 엉뚱한 몸에 든 조각 — 가장 가까운 프리미티브의 규칙은 몸 옆에 늘어뜨린 손 근처의 바지를 손에, 허벅지 옆의 손가락 피부를
# 허벅지에 준다. 그 조각은 관절이 돌면 제 옷에서 떨어져 다른 몸을 따라다닌다. 한 메시 조각 안에서 한 몸의 면이 모서리로 이어진
# 덩어리가 그 몸의 가장 큰 덩어리가 아니거나 그 몸 면 전체의 stray_share 보다 작고, 둘레에 같은 강체 묶음(고정 관절로 묶인 몸들 —
# 몸통과 머리, 아래팔과 손)의 면이 하나도 없으면, 둘레 면이 가장 많이 든 몸으로 옮긴다. 둘레가 없는 덩어리(따로 떨어진 메시)는 둔다.
stray_share: 0.05

# 관절마다 섞는 반경(m). 이음새(두 몸의 면이 함께 쓰는 정점)에서 피부를 따라 잰 거리가 이 안인 정점이 섞인다 — 이음새에서
# 두 몸 반반, 반경에서 제 몸만. 두 강체 묶음 사이에 관절이 여럿이면(좌우 허벅지 사이의 엉덩이 둘) 그 가운데 큰 값.
radius_m:
  hip: 0.10
  knee: 0.08
  ankle: 0.05
  shoulder: 0.08
  elbow: 0.06
