# 관절 인형(v2)에 입히는 형광 조끼 — 피부 내보내기(keti_skin.obj)의 몸통 옷 위에 덮는 매끈한 판.
#
# 조끼는 피부 명세(skin/skin_spec.yaml)에 들지 않는다. 그 내보내기와 텍스처 lock 은 v1 입힌 인형도
# 함께 써서, 거기에 조끼를 더하면 v1 입힌 인형의 바이트가 바뀐다. 그래서 build_dummy.py --vest 가
# 입힌 인형을 지을 때 몸통 옷의 바깥 둘레를 재서 조끼 판을 만들고, 텍스처 없이 단색 재질 둘을 입힌다.
# 메시는 우리가 만든 것이고 인형 USD 안에 실린다(CC BY 4.0).
#
# 모든 값은 과제가 정한 값이다(자체 설정 · determined_by: project). 표준에서 온 값은 없다.
# 조각은 부위 몸마다 하나이고 그 몸과 함께 강체로 움직인다 — 그래서 관절 인형에서 어떤 관절도
# 움직이지 않는 몸통 · 골반 부위에만 둔다(관절이 돌면 팔다리에 붙은 조각은 몸을 뚫는다).
#
# 판은 옷의 면을 따라가지 않는다. 작업복은 흰 티셔츠와 그 위의 멜빵 작업복 두 겹이고 버클 · 주머니 덮개가
# 그 메시의 일부라, 면을 따라 띄우면 그것들이 조끼에 그대로 비친다. 그래서 가슴 안쪽 한 점에서 광선을
# 쏘아 옷의 바깥 둘레를 재고, 그 둘레를 덮듯 고른 뒤 조금 띄운다. 가장자리(아랫단 · 띠 · 진동둘레 · 목둘레 ·
# V넥)는 판을 평면과 곡면으로 잘라 만든다 — 면을 통째로 고르면 경계가 삼각형을 따라 톱니가 된다.

vest_version: "4"
license: CC-BY-4.0
determined_by: project

# 피부 OBJ 안의 원본 객체. 그 객체의 면 가운데 아래 부위로 갈린 면이 조끼가 덮는 옷이다.
source_object: Human.male_worksuit01

# 조끼가 덮는 부위 — 등/어깨 · 흉부 · 복부 · 골반(골반은 아랫단 위의 좁은 가장자리만 남음).
# 옷의 면이 어느 부위에 드는지는 입힌 인형이 피부를 부위 몸마다 가르는 규칙(가장 가까운 부위 프리미티브 ·
# 세 정점 다수결)을 그대로 따르고, 조끼의 면도 같은 규칙으로 이 부위들의 몸에 나눈다.
regions: [BR-04, BR-05, BR-06, BR-07]

# 옷의 둘레를 재는 광선 — 가슴 안쪽의 한 점(centre_m)에서 방위각 azimuth_steps 개 · 앙각 elevation_deg 구간의
# elevation_steps 개로 고르게 나간다(아래 끝은 수평 아래, 위 끝은 수평 위). 그 점은 옷 안이어야 하고(수평에 가장
# 가까운 줄의 광선이 모두 옷에 닿아야 한다) 맨 아래 줄은 아랫단보다 낮아야 하며 맨 위 줄은 자른 뒤에 하나도 남지
# 않아야 한다(빌더가 확인한다). 한 광선은 처음 닿은 옷에서 layer_m 안에 있는 가장 바깥 면을 잰다 — 티셔츠와 그 위의
# 작업복 · 버클은 한 겹이고, 그보다 바깥의 소매는 몸통의 것이 아니다. 아무 옷에도 닿지 않은 광선(목 구멍)은
# 둘레 광선의 값을 이어 받는다.
# 아무 옷에도 닿지 않은 광선(목 구멍)은 둘레 광선의 값(중심을 지나는 수직축에서의 수평 거리)을 이어 받되, 맨 위 줄
# 너머를 축으로 보아 판이 목을 따라 솟지 않고 목 위를 덮듯 닫힌다(그 부분은 목둘레가 잘라 낸다). 그다음 광선을 따라 잰
# 거리로 drape_passes 번 「3 × 3 평균을 두 번 하고 옷과, 옷에서 drape_max_m 바깥 사이로 자르기」를 되풀이해 버클 ·
# 주머니 덮개 위로 천을 덮은 것처럼 만들고(버클은 판 아래에서 12 mm 안팎 솟음), 3 × 3 평균을 smooth_passes 번 더 한다
# (이때도 옷 아래로는 내려가지 않게). 광선이 옷에 비스듬히 닿는 아랫단 쪽에서는 평균이 판을 옷에서 조금 띄워 조끼가
# 몸에 달라붙지 않고 느슨하게 걸린다.
shell:
  centre_m: [0.02, 0.0, 1.27]
  azimuth_steps: 180
  elevation_deg: [-66.0, 82.0]
  elevation_steps: 111
  layer_m: 0.02
  drape_passes: 80
  drape_max_m: 0.06
  smooth_passes: 1

# 고른 둘레에서 광선을 따라 바깥으로 더 나가는 거리. 고른 둘레는 어느 광선에서도 옷 아래로 내려가지 않으므로
# 판은 격자점마다 그 광선이 닿은 옷에서 이만큼 이상 떨어진다(격자점 사이는 그 점들을 잇는 평면).
offset_m: 0.008

# 조끼의 아랫단 — 판을 이 높이의 수평면에서 잘라 위만 남긴다. 복부 상자(anthropometry.yaml BR-06)의 아래 끝.
hem_z_m: 1.04

# 반사 띠 — 판을 띠의 위아래 경계에서도 수평면으로 자르고, 그 사이의 면이 띠의 재질.
bands_z_m:
  - [1.085, 1.135]
  - [1.235, 1.285]

# 진동둘레 — 이 타원체 안을 잘라 낸다(빌더는 판을 자르지 않는 진동둘레 · 목둘레 · 아랫단을 거부한다). 왼쪽(+y) 것이고 오른쪽은 y 를 뒤집은 것. 어깨 관절 둘레에 놓아
# 앞판 · 뒤판의 가장자리가 어깨 끈에서 겨드랑이까지 곡선으로 이어지고, 흰 티셔츠의 소매가 그 밖에 남는다.
armhole:
  centre_m: [0.0, 0.23, 1.42]
  radii_m: [0.16, 0.09, 0.17]

# 목둘레 — 이 수직 원기둥 안을 잘라 낸다. 중심은 티셔츠 목 테두리의 가운데.
neck:
  centre_m: [0.014, 0.0]
  radius_m: 0.075

# V넥 — 앞(x > front_x_m)에서 bottom_z_m 의 한 점부터 양옆으로 기울기 slope(높이 / 옆 거리)로 올라가는 두
# 평면 위를 잘라 낸다. 작업복의 버클(1.31–1.38 m · 가운데에서 6.5–11.6 cm 옆)은 그 선 아래에 든다.
v_neck:
  front_x_m: 0.0
  bottom_z_m: 1.38
  slope: 1.6

# 재질 둘. color 는 sRGB(0–1) 그대로 OmniPBR 의 diffuse_color_constant 에 쓴다 — 피부 재질이 MTL 의
# 색(Kd)을 쓰는 것과 같은 변환이다. roughness · metallic 은 같은 셰이더의 상수.
materials:
  vest_yellow:                   # 형광 노랑 몸판
    color: [0.80, 1.00, 0.00]
    roughness: 0.6
    metallic: 0.0
  vest_band:                     # 반사 띠 — 밝은 회색, 거의 무광(금속감이 크면 둘레의 골판지를 비춰 갈색으로 읽힌다)
    color: [0.88, 0.88, 0.88]
    roughness: 0.35
    metallic: 0.1
