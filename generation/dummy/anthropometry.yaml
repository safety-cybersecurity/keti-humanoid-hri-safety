# 인체 더미의 부위별 치수. ISO/TS 15066 부속서 A 는 부위별 힘·압력 한계(표 A.2)와
# 유효질량·유효탄성계수(표 A.3)를 규정하고 형상 치수는 규정하지 않으므로, 치수는
# 본 과제가 정한다.
#
# 값의 출처가 표준이 아니라는 점이 중요하다. meta/rules.json 의 contact_limits 는
# 표준 전재 구역이고 이 파일은 과제 결정 구역이다. 둘을 한 파일에 섞으면 어느 값이
# 표준에서 왔는지 알 수 없게 된다.
#
# status: provisional — 성인 남성 중앙값 근사이며 Size Korea 실측 통계로 교체 대상.
# 치수를 바꿔도 부위 분할과 BR 코드 대응은 그대로이므로 재생성만 하면 된다.

anthropometry_version: "0.1"
status: provisional
determined_by: project
source_note: "성인 남성 50 퍼센타일 근사. Size Korea 인체치수조사 결과로 교체할 것"
units:
  length: m

# 서 있는 자세 기준. origin 은 발바닥 중앙, +z 가 위, +x 가 정면.
stature: 1.74

# 각 부위의 형상과 배치.
#   shape   capsule (축 방향 axis) | sphere | box
#   center  루트 기준 위치 [x, y, z]
#   axis    capsule 의 축 ("x" | "y" | "z")
#   parent  고정 조인트로 연결할 상위 부위. null 이면 루트에 붙는다
regions:
  BR-01:                      # 두개골/이마
    shape: sphere
    radius: 0.088
    center: [0.0, 0.0, 1.660]
    parent: BR-03
  BR-02:                      # 얼굴
    shape: box
    size: [0.060, 0.130, 0.130]
    center: [0.060, 0.0, 1.610]
    parent: BR-01
  BR-03:                      # 목
    shape: capsule
    radius: 0.055
    height: 0.080
    axis: z
    center: [0.0, 0.0, 1.520]
    parent: BR-04
  BR-04:                      # 등/어깨
    shape: box
    size: [0.180, 0.400, 0.160]
    center: [-0.030, 0.0, 1.430]
    parent: null
  BR-05:                      # 흉부
    shape: box
    size: [0.200, 0.320, 0.240]
    center: [0.020, 0.0, 1.310]
    parent: BR-04
  BR-06:                      # 복부
    shape: box
    size: [0.190, 0.300, 0.180]
    center: [0.010, 0.0, 1.130]
    parent: BR-05
  BR-07:                      # 골반
    shape: box
    size: [0.200, 0.330, 0.160]
    center: [0.0, 0.0, 0.980]
    parent: BR-06
  BR-08:                      # 상완/팔꿈치 (좌우 한 쌍)
    shape: capsule
    radius: 0.048
    height: 0.260
    axis: z
    center: [0.0, 0.210, 1.290]
    mirror_y: true
    parent: BR-04
  BR-09:                      # 전완/손목 (좌우 한 쌍)
    shape: capsule
    radius: 0.042
    height: 0.240
    axis: z
    center: [0.0, 0.215, 1.030]
    mirror_y: true
    parent: BR-08
  BR-10:                      # 손/손가락 (좌우 한 쌍)
    shape: box
    size: [0.030, 0.090, 0.190]
    center: [0.0, 0.215, 0.830]
    mirror_y: true
    parent: BR-09
  BR-11:                      # 대퇴/무릎 (좌우 한 쌍)
    shape: capsule
    radius: 0.075
    height: 0.380
    axis: z
    center: [0.0, 0.090, 0.700]
    mirror_y: true
    parent: BR-07
  BR-12:                      # 하퇴 (좌우 한 쌍)
    shape: capsule
    radius: 0.055
    height: 0.380
    axis: z
    center: [0.0, 0.090, 0.290]
    mirror_y: true
    parent: BR-11
